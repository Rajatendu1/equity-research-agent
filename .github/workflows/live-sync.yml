name: Live sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: node scripts/assert-live-sync.mjs
